# Weekly dependency updates, one grouped PR per ecosystem. Security updates
# come at once. npm updates wait 5 days after a release (cooldown).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only; lift this when it supports 7.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # Mnemo targets Node 24; its types follow the runtime, not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(deps)"
    ignore:
      # Mnemo runs on Node 24 (LTS); a new major is a deliberate change.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
